<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#999" />
    </marker>
  </defs>

  <!-- Stage 1: 52-Card Deck (input - blue) -->
  <rect x="4" y="55" width="108" height="90" rx="10" ry="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5" />
  <text x="58" y="90" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">52-Card Deck</text>
  <text x="58" y="106" text-anchor="middle" fill="#666" font-size="8.5">1326 possible</text>
  <text x="58" y="117" text-anchor="middle" fill="#666" font-size="8.5">2-card hands</text>

  <!-- Arrow 1-2 -->
  <line x1="112" y1="100" x2="130" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 2: Card Isomorphism (input - blue) -->
  <rect x="132" y="55" width="108" height="90" rx="10" ry="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5" />
  <text x="186" y="85" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Card</text>
  <text x="186" y="98" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Isomorphism</text>
  <text x="186" y="114" text-anchor="middle" fill="#666" font-size="8.5">Suit equivalence</text>
  <text x="186" y="125" text-anchor="middle" fill="#666" font-size="8.5">169 unique classes</text>

  <!-- Arrow 2-3 -->
  <line x1="240" y1="100" x2="258" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 3: Card Bucketing (processing - green) -->
  <rect x="260" y="55" width="108" height="90" rx="10" ry="10" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.5" />
  <text x="314" y="85" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Card</text>
  <text x="314" y="98" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Bucketing</text>
  <text x="314" y="114" text-anchor="middle" fill="#666" font-size="8.5">Monte Carlo sim</text>
  <text x="314" y="125" text-anchor="middle" fill="#666" font-size="8.5">5 win-rate buckets</text>

  <!-- Arrow 3-4 -->
  <line x1="368" y1="100" x2="386" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 4: Opponent Modelling (processing - green) -->
  <rect x="388" y="55" width="108" height="90" rx="10" ry="10" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.5" />
  <text x="442" y="85" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Opponent</text>
  <text x="442" y="98" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Modelling</text>
  <text x="442" y="114" text-anchor="middle" fill="#666" font-size="8.5">Aggressiveness</text>
  <text x="442" y="125" text-anchor="middle" fill="#666" font-size="8.5">+ Tightness</text>

  <!-- Arrow 4-5 -->
  <line x1="496" y1="100" x2="514" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 5: CFR / DQN (processing - green) -->
  <rect x="516" y="55" width="108" height="90" rx="10" ry="10" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.5" />
  <text x="570" y="90" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">CFR / DQN</text>
  <text x="570" y="106" text-anchor="middle" fill="#666" font-size="8.5">Regret min. or</text>
  <text x="570" y="117" text-anchor="middle" fill="#666" font-size="8.5">Deep-Q Network</text>

  <!-- Arrow 5-6 -->
  <line x1="624" y1="100" x2="642" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 6: Probability 3-tuple (output - orange) -->
  <rect x="644" y="55" width="108" height="90" rx="10" ry="10" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1.5" />
  <text x="698" y="85" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Probability</text>
  <text x="698" y="98" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">3-tuple</text>
  <text x="698" y="114" text-anchor="middle" fill="#666" font-size="8.5">P(raise), P(call),</text>
  <text x="698" y="125" text-anchor="middle" fill="#666" font-size="8.5">P(fold)</text>

  <!-- Arrow 6-7 -->
  <line x1="752" y1="100" x2="770" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 7: Action (output - orange) -->
  <rect x="772" y="55" width="108" height="90" rx="10" ry="10" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1.5" />
  <text x="826" y="90" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Action</text>
  <text x="826" y="106" text-anchor="middle" fill="#666" font-size="8.5">Raise, Call,</text>
  <text x="826" y="117" text-anchor="middle" fill="#666" font-size="8.5">or Fold</text>

  <!-- Legend -->
  <rect x="290" y="170" width="10" height="10" rx="2" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" />
  <text x="304" y="179" fill="#666" font-size="8.5">Input</text>
  <rect x="340" y="170" width="10" height="10" rx="2" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1" />
  <text x="354" y="179" fill="#666" font-size="8.5">Processing</text>
  <rect x="410" y="170" width="10" height="10" rx="2" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1" />
  <text x="424" y="179" fill="#666" font-size="8.5">Output</text>
</svg>