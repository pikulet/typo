<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowNavy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b3a5c"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b8860b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d4f"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
      .panel-title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
      .label { font-size: 11px; fill: #444; }
      .label-bold { font-size: 11px; fill: #444; font-weight: 600; }
      .annotation { font-size: 10px; fill: #666; font-style: italic; }
      .endpoint { font-size: 11px; fill: #555; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Title -->
  <text x="440" y="32" text-anchor="middle" class="title">HTTP/1.1 vs HTTP/2: Head-of-Line Blocking Solved</text>

  <!-- Divider -->
  <line x1="440" y1="50" x2="440" y2="490" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ==================== LEFT PANEL: HTTP/1.1 ==================== -->
  <text x="220" y="62" text-anchor="middle" class="panel-title">HTTP/1.1 (Sequential)</text>

  <!-- Client / Server labels -->
  <text x="100" y="90" text-anchor="middle" class="endpoint">Client</text>
  <text x="340" y="90" text-anchor="middle" class="endpoint">Server</text>

  <!-- Lifelines -->
  <line x1="100" y1="96" x2="100" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="340" y1="96" x2="340" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Request 1 -->
  <line x1="100" y1="110" x2="340" y2="130" stroke="#1b3a5c" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="220" y="112" text-anchor="middle" class="label-bold" fill="#1b3a5c">Request 1</text>

  <!-- Response 1 -->
  <line x1="340" y1="140" x2="100" y2="160" stroke="#1b3a5c" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="220" y="155" text-anchor="middle" class="label-bold" fill="#1b3a5c">Response 1</text>

  <!-- Blocked time indicator -->
  <rect x="86" y="168" width="28" height="50" rx="3" fill="#f0e0e0" stroke="#d4a0a0" stroke-width="1" opacity="0.7"/>
  <text x="100" y="196" text-anchor="middle" font-size="9" fill="#b55" font-weight="600">IDLE</text>

  <!-- Blocking bracket -->
  <line x1="70" y1="168" x2="70" y2="218" stroke="#c66" stroke-width="1.5"/>
  <line x1="66" y1="168" x2="74" y2="168" stroke="#c66" stroke-width="1.5"/>
  <line x1="66" y1="218" x2="74" y2="218" stroke="#c66" stroke-width="1.5"/>
  <text x="60" y="196" text-anchor="end" font-size="9" fill="#c66" font-weight="600">Blocked</text>

  <!-- Request 2 -->
  <line x1="100" y1="225" x2="340" y2="245" stroke="#b8860b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="220" y="227" text-anchor="middle" class="label-bold" fill="#b8860b">Request 2</text>

  <!-- Response 2 -->
  <line x1="340" y1="255" x2="100" y2="275" stroke="#b8860b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="220" y="270" text-anchor="middle" class="label-bold" fill="#b8860b">Response 2</text>

  <!-- Blocked time indicator 2 -->
  <rect x="86" y="283" width="28" height="50" rx="3" fill="#f0e0e0" stroke="#d4a0a0" stroke-width="1" opacity="0.7"/>
  <text x="100" y="311" text-anchor="middle" font-size="9" fill="#b55" font-weight="600">IDLE</text>

  <!-- Request 3 -->
  <line x1="100" y1="340" x2="340" y2="360" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="220" y="342" text-anchor="middle" class="label-bold" fill="#2e7d4f">Request 3</text>

  <!-- Response 3 -->
  <line x1="340" y1="370" x2="100" y2="390" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="220" y="385" text-anchor="middle" class="label-bold" fill="#2e7d4f">Response 3</text>

  <!-- Annotation -->
  <text x="220" y="440" text-anchor="middle" class="annotation">Head-of-line blocking: each request must</text>
  <text x="220" y="454" text-anchor="middle" class="annotation">wait for the previous response to complete.</text>

  <!-- TCP connection label -->
  <rect x="50" y="460" width="340" height="24" rx="4" fill="#eef" stroke="#ccd" stroke-width="1"/>
  <text x="220" y="476" text-anchor="middle" font-size="10" fill="#556">Single TCP Connection</text>

  <!-- ==================== RIGHT PANEL: HTTP/2 ==================== -->
  <text x="660" y="62" text-anchor="middle" class="panel-title">HTTP/2 (Multiplexed)</text>

  <!-- Client / Server labels -->
  <text x="510" y="90" text-anchor="middle" class="endpoint">Client</text>
  <text x="810" y="90" text-anchor="middle" class="endpoint">Server</text>

  <!-- Connection pipe -->
  <rect x="508" y="96" width="304" height="330" rx="6" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Stream legend -->
  <rect x="520" y="102" width="10" height="10" rx="2" fill="#1b3a5c"/>
  <text x="534" y="111" font-size="10" fill="#444">Stream 1</text>
  <rect x="600" y="102" width="10" height="10" rx="2" fill="#b8860b"/>
  <text x="614" y="111" font-size="10" fill="#444">Stream 2</text>
  <rect x="680" y="102" width="10" height="10" rx="2" fill="#2e7d4f"/>
  <text x="694" y="111" font-size="10" fill="#444">Stream 3</text>

  <!-- Interleaved frames - row by row going left to right -->
  <!-- Row 1 -->
  <rect x="520" y="125" width="80" height="22" rx="4" fill="#1b3a5c" opacity="0.85"/>
  <text x="560" y="140" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">REQ 1 Frame</text>

  <rect x="610" y="125" width="80" height="22" rx="4" fill="#b8860b" opacity="0.85"/>
  <text x="650" y="140" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">REQ 2 Frame</text>

  <rect x="700" y="125" width="80" height="22" rx="4" fill="#2e7d4f" opacity="0.85"/>
  <text x="740" y="140" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">REQ 3 Frame</text>

  <!-- Row 2 -->
  <rect x="520" y="157" width="80" height="22" rx="4" fill="#2e7d4f" opacity="0.85"/>
  <text x="560" y="172" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">REQ 3 Frame</text>

  <rect x="610" y="157" width="80" height="22" rx="4" fill="#1b3a5c" opacity="0.85"/>
  <text x="650" y="172" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">REQ 1 Frame</text>

  <rect x="700" y="157" width="80" height="22" rx="4" fill="#b8860b" opacity="0.85"/>
  <text x="740" y="172" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">REQ 2 Frame</text>

  <!-- Arrow indicating direction -->
  <text x="660" y="202" text-anchor="middle" font-size="10" fill="#888">--- requests sent concurrently ---></text>

  <!-- Interleaved response frames -->
  <!-- Row 3 -->
  <rect x="520" y="215" width="80" height="22" rx="4" fill="#b8860b" opacity="0.7"/>
  <text x="560" y="230" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 2 Frame</text>

  <rect x="610" y="215" width="80" height="22" rx="4" fill="#1b3a5c" opacity="0.7"/>
  <text x="650" y="230" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 1 Frame</text>

  <rect x="700" y="215" width="80" height="22" rx="4" fill="#2e7d4f" opacity="0.7"/>
  <text x="740" y="230" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 3 Frame</text>

  <!-- Row 4 -->
  <rect x="520" y="247" width="80" height="22" rx="4" fill="#1b3a5c" opacity="0.7"/>
  <text x="560" y="262" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 1 Frame</text>

  <rect x="610" y="247" width="80" height="22" rx="4" fill="#2e7d4f" opacity="0.7"/>
  <text x="650" y="262" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 3 Frame</text>

  <rect x="700" y="247" width="80" height="22" rx="4" fill="#b8860b" opacity="0.7"/>
  <text x="740" y="262" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 2 Frame</text>

  <!-- Row 5 -->
  <rect x="520" y="279" width="80" height="22" rx="4" fill="#2e7d4f" opacity="0.7"/>
  <text x="560" y="294" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 3 Frame</text>

  <rect x="610" y="279" width="80" height="22" rx="4" fill="#b8860b" opacity="0.7"/>
  <text x="650" y="294" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 2 Frame</text>

  <rect x="700" y="279" width="80" height="22" rx="4" fill="#1b3a5c" opacity="0.7"/>
  <text x="740" y="294" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">RSP 1 Frame</text>

  <!-- Arrow indicating direction -->
  <text x="660" y="320" text-anchor="middle" font-size="10" fill="#888">&lt;--- responses arrive interleaved ---</text>

  <!-- Time comparison -->
  <rect x="520" y="340" width="260" height="36" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="650" y="354" text-anchor="middle" font-size="10" fill="#2e7d4f" font-weight="600">All 3 requests complete faster</text>
  <text x="650" y="368" text-anchor="middle" font-size="10" fill="#2e7d4f">No waiting, no blocking</text>

  <!-- Annotation -->
  <text x="660" y="440" text-anchor="middle" class="annotation">Frames from multiple streams are</text>
  <text x="660" y="454" text-anchor="middle" class="annotation">interleaved on one connection.</text>

  <!-- TCP connection label -->
  <rect x="490" y="460" width="340" height="24" rx="4" fill="#eef" stroke="#ccd" stroke-width="1"/>
  <text x="660" y="476" text-anchor="middle" font-size="10" fill="#556">Single TCP Connection</text>

</svg>