<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-neutral" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">WannaCry Sinkhole Mechanism</text>

  <!-- ===== TOP PATH: Before Sinkhole ===== -->
  <rect x="20" y="56" width="840" height="186" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="440" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" letter-spacing="0.5">BEFORE SINKHOLE  --  Domain Unregistered</text>

  <!-- Node 1: WannaCry -->
  <rect x="40" y="100" width="136" height="56" rx="8" fill="#475569" filter="url(#shadow)"/>
  <text x="108" y="125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">WannaCry</text>
  <text x="108" y="142" text-anchor="middle" font-size="10.5" fill="#cbd5e1">malware runs</text>

  <!-- Arrow 1→2 -->
  <line x1="176" y1="128" x2="218" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-neutral)"/>

  <!-- Node 2: HTTP request -->
  <rect x="226" y="100" width="148" height="56" rx="8" fill="#475569" filter="url(#shadow)"/>
  <text x="300" y="122" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">HTTP request to</text>
  <text x="300" y="139" text-anchor="middle" font-size="10" fill="#cbd5e1">killswitch domain</text>

  <!-- Arrow 2→3 -->
  <line x1="374" y1="128" x2="416" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-neutral)"/>

  <!-- Node 3: DNS NXDOMAIN -->
  <rect x="424" y="96" width="160" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="504" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">DNS: NXDOMAIN</text>
  <text x="504" y="137" text-anchor="middle" font-size="10.5" fill="#991b1b">domain does not exist</text>
  <text x="504" y="152" text-anchor="middle" font-size="10" fill="#b91c1c">connection fails</text>

  <!-- Arrow 3→4 -->
  <line x1="584" y1="128" x2="626" y2="128" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Node 4: Encrypts files -->
  <rect x="634" y="94" width="200" height="68" rx="8" fill="#dc2626" filter="url(#shadow)"/>
  <!-- Warning triangle -->
  <text x="670" y="132" font-size="22" fill="#fff">&#9888;</text>
  <text x="734" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Encrypts Files</text>
  <text x="734" y="140" text-anchor="middle" font-size="10.5" fill="#fecaca">payload executes</text>
  <text x="734" y="155" text-anchor="middle" font-size="10" fill="#fecaca">ransom demanded</text>

  <!-- ===== Divider ===== -->
  <line x1="40" y1="264" x2="840" y2="264" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== BOTTOM PATH: After Sinkhole ===== -->
  <rect x="20" y="282" width="840" height="186" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="440" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#166534" letter-spacing="0.5">AFTER SINKHOLE  --  Domain Registered by KryptosLogic</text>

  <!-- Node 1: WannaCry -->
  <rect x="40" y="326" width="136" height="56" rx="8" fill="#475569" filter="url(#shadow)"/>
  <text x="108" y="351" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">WannaCry</text>
  <text x="108" y="368" text-anchor="middle" font-size="10.5" fill="#cbd5e1">malware runs</text>

  <!-- Arrow 1→2 -->
  <line x1="176" y1="354" x2="218" y2="354" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-neutral)"/>

  <!-- Node 2: HTTP request -->
  <rect x="226" y="326" width="148" height="56" rx="8" fill="#475569" filter="url(#shadow)"/>
  <text x="300" y="348" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">HTTP request to</text>
  <text x="300" y="365" text-anchor="middle" font-size="10" fill="#cbd5e1">killswitch domain</text>

  <!-- Arrow 2→3 -->
  <line x1="374" y1="354" x2="416" y2="354" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-neutral)"/>

  <!-- Node 3: DNS resolves -->
  <rect x="424" y="322" width="160" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="504" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">DNS: Resolves</text>
  <text x="504" y="363" text-anchor="middle" font-size="10.5" fill="#166534">routed to KryptosLogic</text>
  <text x="504" y="378" text-anchor="middle" font-size="10" fill="#15803d">connection succeeds</text>

  <!-- Arrow 3→4 -->
  <line x1="584" y1="354" x2="626" y2="354" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Node 4: Malware exits -->
  <rect x="634" y="320" width="200" height="68" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <!-- Checkmark -->
  <text x="670" y="360" font-size="22" fill="#fff">&#10003;</text>
  <text x="738" y="349" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Malware Exits</text>
  <text x="738" y="367" text-anchor="middle" font-size="10.5" fill="#bbf7d0">payload skipped</text>
  <text x="738" y="382" text-anchor="middle" font-size="10" fill="#bbf7d0">files safe</text>

  <!-- Footer note -->
  <text x="440" y="500" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">The killswitch domain check determines whether WannaCry encrypts or exits.</text>
</svg>