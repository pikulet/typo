<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="520" height="620" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="260" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Felicity Conditions: Is the bet valid?</text>

  <!-- Condition 1: Conventional procedure exists? -->
  <rect x="80" y="65" width="360" height="56" rx="6" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#f1f5f9" font-weight="bold">1. Conventional procedure exists?</text>
  <text x="260" y="108" text-anchor="middle" font-size="11" fill="#cbd5e1">(Is betting a recognized convention?)</text>

  <!-- Yes branch from Condition 1 -->
  <line x1="260" y1="121" x2="260" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Yes label with checkmark -->
  <rect x="280" y="127" width="68" height="24" rx="4" fill="#166534"/>
  <text x="314" y="144" text-anchor="middle" font-size="12" fill="#bbf7d0" font-weight="bold">Yes</text>

  <!-- Condition 2: Properly executed? -->
  <rect x="80" y="165" width="360" height="56" rx="6" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="260" y="188" text-anchor="middle" font-size="13" fill="#f1f5f9" font-weight="bold">2. Properly executed (reciprocated)?</text>
  <text x="260" y="208" text-anchor="middle" font-size="11" fill="#cbd5e1">(Did Lisa accept the bet?)</text>

  <!-- No branch from Condition 2 -->
  <line x1="260" y1="221" x2="260" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- No label with X -->
  <rect x="280" y="227" width="68" height="24" rx="4" fill="#991b1b"/>
  <text x="314" y="244" text-anchor="middle" font-size="12" fill="#fecaca" font-weight="bold">No</text>

  <!-- Condition 3: Sincere? -->
  <rect x="80" y="265" width="360" height="56" rx="6" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" fill="#f1f5f9" font-weight="bold">3. Sincere?</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#cbd5e1">(Was the teacher genuinely betting?)</text>

  <!-- No branch from Condition 3 -->
  <line x1="260" y1="321" x2="260" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- No label with X -->
  <rect x="280" y="327" width="68" height="24" rx="4" fill="#991b1b"/>
  <text x="314" y="344" text-anchor="middle" font-size="12" fill="#fecaca" font-weight="bold">No</text>

  <!-- Explanation boxes on the right side -->
  <!-- Explanation for Condition 2 No -->
  <!-- Explanation for Condition 3 No -->

  <!-- Result box -->
  <rect x="110" y="365" width="300" height="60" rx="8" fill="#7f1d1d" stroke="#991b1b" stroke-width="2"/>
  <text x="260" y="395" text-anchor="middle" font-size="18" fill="#fef2f2" font-weight="bold">INFELICITOUS</text>
  <text x="260" y="415" text-anchor="middle" font-size="11" fill="#fca5a5">The bet is not valid</text>

  <!-- Detail annotations -->
  <!-- Annotation for Condition 1 -->
  <rect x="60" y="455" width="400" height="46" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <circle cx="82" cy="478" r="10" fill="#166534"/>
  <text x="82" y="482" text-anchor="middle" font-size="12" fill="#bbf7d0" font-weight="bold">1</text>
  <text x="100" y="474" font-size="11" fill="#166534" font-weight="bold">Conventional procedure: YES</text>
  <text x="100" y="490" font-size="10" fill="#15803d">Betting is a recognized social convention.</text>

  <!-- Annotation for Condition 2 -->
  <rect x="60" y="510" width="400" height="46" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <circle cx="82" cy="533" r="10" fill="#991b1b"/>
  <text x="82" y="537" text-anchor="middle" font-size="12" fill="#fecaca" font-weight="bold">2</text>
  <text x="100" y="529" font-size="11" fill="#991b1b" font-weight="bold">Proper execution: NO</text>
  <text x="100" y="545" font-size="10" fill="#b91c1c">Lisa did not accept or reciprocate the bet.</text>

  <!-- Annotation for Condition 3 -->
  <rect x="60" y="565" width="400" height="46" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <circle cx="82" cy="588" r="10" fill="#991b1b"/>
  <text x="82" y="592" text-anchor="middle" font-size="12" fill="#fecaca" font-weight="bold">3</text>
  <text x="100" y="584" font-size="11" fill="#991b1b" font-weight="bold">Sincerity: NO</text>
  <text x="100" y="600" font-size="10" fill="#b91c1c">Teacher's real intent was to hear the saxophone.</text>
</svg>