<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d32f2f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2e7d32"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f57f17"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#212121">Write Before Scan: Ghost Row Problem</text>

  <!-- Time axis -->
  <line x1="80" y1="380" x2="760" y2="380" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="80" y="400" text-anchor="middle" font-size="12" fill="#757575">t1</text>
  <text x="310" y="400" text-anchor="middle" font-size="12" fill="#757575">t2</text>
  <text x="540" y="400" text-anchor="middle" font-size="12" fill="#757575">t3</text>
  <text x="740" y="400" text-anchor="middle" font-size="12" fill="#757575">Result</text>
  <!-- tick marks -->
  <line x1="80" y1="376" x2="80" y2="384" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="310" y1="376" x2="310" y2="384" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="540" y1="376" x2="540" y2="384" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="740" y1="376" x2="740" y2="384" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="420" y="416" text-anchor="middle" font-size="11" fill="#9e9e9e">time &#x2192;</text>

  <!-- ===== APPLICATION TIMELINE (top) ===== -->
  <text x="40" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#424242">App</text>
  <line x1="70" y1="96" x2="760" y2="96" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- t1: Application deletes id=30000 from OLD db -->
  <circle cx="80" cy="96" r="8" fill="#d32f2f"/>
  <rect x="16" y="56" width="128" height="30" rx="4" fill="#ffebee" stroke="#d32f2f" stroke-width="1"/>
  <text x="80" y="75" text-anchor="middle" font-size="10.5" fill="#c62828" font-weight="600">DELETE id=30000</text>
  <text x="80" y="120" text-anchor="middle" font-size="10" fill="#d32f2f">from OLD database</text>

  <!-- ===== BINLOG REPLAY TIMELINE (middle) ===== -->
  <text x="40" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#424242">Binlog</text>
  <text x="40" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#424242">Replay</text>
  <line x1="70" y1="210" x2="760" y2="210" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- t2: Binlog replay tries delete on NEW db — no-op -->
  <circle cx="310" cy="210" r="8" fill="#f57f17"/>
  <rect x="220" y="168" width="180" height="30" rx="4" fill="#fff8e1" stroke="#f57f17" stroke-width="1"/>
  <text x="310" y="187" text-anchor="middle" font-size="10.5" fill="#e65100" font-weight="600">DELETE id=30000 on NEW db</text>
  <text x="310" y="237" text-anchor="middle" font-size="10" fill="#f57f17">No-op: row not yet copied!</text>

  <!-- Arrow from t1 app to t2 binlog -->
  <path d="M88,104 Q200,155 302,202" fill="none" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>

  <!-- ===== SCAN PROCESS TIMELINE (bottom) ===== -->
  <text x="40" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#424242">Scan</text>
  <line x1="70" y1="306" x2="760" y2="306" stroke="#2e7d32" stroke-width="2"/>

  <!-- Scan progress markers -->
  <circle cx="100" cy="306" r="4" fill="#2e7d32"/>
  <text x="100" y="332" text-anchor="middle" font-size="9" fill="#2e7d32">id=1</text>

  <circle cx="160" cy="306" r="4" fill="#2e7d32"/>
  <text x="160" y="332" text-anchor="middle" font-size="9" fill="#2e7d32">id=2</text>

  <circle cx="220" cy="306" r="4" fill="#2e7d32"/>
  <text x="220" y="332" text-anchor="middle" font-size="9" fill="#2e7d32">...</text>

  <!-- Green progress bar up to scan position -->
  <rect x="70" y="300" width="470" height="12" rx="2" fill="#e8f5e9" opacity="0.5"/>

  <!-- t3: Scan reaches id=30000, copies to NEW db -->
  <circle cx="540" cy="306" r="8" fill="#d32f2f"/>
  <rect x="458" y="264" width="164" height="30" rx="4" fill="#ffebee" stroke="#d32f2f" stroke-width="1"/>
  <text x="540" y="283" text-anchor="middle" font-size="10.5" fill="#c62828" font-weight="600">Scan copies id=30000</text>
  <text x="540" y="340" text-anchor="middle" font-size="10" fill="#d32f2f">INSERT into NEW database</text>

  <!-- ===== RESULT BOX ===== -->
  <rect x="650" y="130" width="150" height="100" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="725" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#d32f2f">Ghost Row!</text>
  <line x1="665" y1="165" x2="735" y2="165" stroke="#ef9a9a" stroke-width="1"/>
  <text x="725" y="182" text-anchor="middle" font-size="10" fill="#c62828">id=30000 exists in</text>
  <text x="725" y="196" text-anchor="middle" font-size="10" fill="#c62828">NEW database but</text>
  <text x="725" y="210" text-anchor="middle" font-size="10" fill="#c62828">was deleted from OLD</text>

  <!-- Arrow from t3 scan to result -->
  <path d="M556,298 Q620,260 660,220" fill="none" stroke="#d32f2f" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Legend -->
  <rect x="80" y="360" width="8" height="8" rx="2" fill="#2e7d32"/>
  <text x="94" y="368" font-size="10" fill="#616161">Normal scan progress</text>
  <rect x="220" y="360" width="8" height="8" rx="2" fill="#f57f17"/>
  <text x="234" y="368" font-size="10" fill="#616161">Warning (no-op)</text>
  <rect x="340" y="360" width="8" height="8" rx="2" fill="#d32f2f"/>
  <text x="354" y="368" font-size="10" fill="#616161">Problematic event</text>
</svg>