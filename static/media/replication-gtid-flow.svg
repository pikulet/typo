<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4682B4"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" fill="white"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" fill="#1B2A4A" font-size="14" font-weight="bold">GTID-based Loop Detection Flow</text>

  <!-- Swimlane headers -->
  <rect x="100" y="50" width="160" height="34" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="180" y="72" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="bold">Node A</text>

  <rect x="460" y="50" width="160" height="34" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="540" y="72" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="bold">Node B</text>

  <!-- Vertical lifelines -->
  <line x1="180" y1="84" x2="180" y2="400" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="540" y1="84" x2="540" y2="400" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Step 1: A executes tx -->
  <rect x="90" y="104" width="180" height="28" rx="4" fill="#EEF2F7" stroke="#4682B4" stroke-width="1.5"/>
  <text x="180" y="123" text-anchor="middle" fill="#4682B4" font-size="11">Executes tx</text>

  <!-- Step 2: A sends tx to B with GTID -->
  <line x1="192" y1="150" x2="528" y2="150" stroke="#4682B4" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="270" y="135" width="220" height="22" rx="3" fill="white" stroke="#4682B4" stroke-width="1"/>
  <text x="380" y="151" text-anchor="middle" fill="#4682B4" font-size="11" font-weight="bold">tx with GTID uuid_A:1</text>

  <!-- Step 3: B detects foreign UUID -->
  <rect x="450" y="170" width="180" height="28" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="540" y="189" text-anchor="middle" fill="#1B2A4A" font-size="11">Detects uuid_A != own</text>

  <!-- Step 4: B sets gtid_next -->
  <rect x="440" y="212" width="200" height="40" rx="4" fill="#FFF3E0" stroke="#C67A00" stroke-width="2"/>
  <text x="540" y="230" text-anchor="middle" fill="#C67A00" font-size="11" font-weight="bold">SET gtid_next =</text>
  <text x="540" y="245" text-anchor="middle" fill="#C67A00" font-size="11" font-weight="bold">'uuid_A:1'</text>

  <!-- Step 5: B writes tx_copy with preserved GTID -->
  <rect x="450" y="268" width="180" height="28" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="540" y="287" text-anchor="middle" fill="#2E7D32" font-size="11">Writes tx_copy</text>

  <!-- Step 6: tx_copy sent back to A -->
  <line x1="528" y1="316" x2="192" y2="316" stroke="#2E7D32" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="260" y="301" width="240" height="22" rx="3" fill="white" stroke="#2E7D32" stroke-width="1"/>
  <text x="380" y="317" text-anchor="middle" fill="#2E7D32" font-size="11" font-weight="bold">tx_copy with GTID uuid_A:1</text>

  <!-- Step 7: A recognises own UUID -->
  <rect x="68" y="338" width="224" height="40" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="180" y="356" text-anchor="middle" fill="#2E7D32" font-size="11" font-weight="bold">uuid_A:1 matches own UUID</text>
  <text x="180" y="371" text-anchor="middle" fill="#2E7D32" font-size="11">Transaction ignored</text>

  <!-- Annotation -->
  <rect x="135" y="400" width="490" height="28" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>
  <text x="380" y="419" text-anchor="middle" fill="#455A64" font-size="11">By preserving the original GTID, A can detect and discard its own transactions.</text>
</svg>