<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14">
  <!-- Background -->
  <rect width="720" height="460" fill="white"/>

  <!-- Left Panel: Intended Single Transaction -->
  <text x="175" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Intended: Single Transaction</text>

  <!-- Single transaction box — vertically centered relative to right panel -->
  <rect x="70" y="110" width="210" height="195" rx="6" ry="6" fill="none" stroke="#4682B4" stroke-width="2.5"/>

  <!-- BEGIN -->
  <rect x="90" y="125" width="170" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="175" y="147" text-anchor="middle" font-size="14" fill="#2c3e50">BEGIN</text>

  <!-- dummy -->
  <rect x="90" y="170" width="170" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="175" y="192" text-anchor="middle" font-size="14" fill="#6c757d">dummy</text>

  <!-- STMT -->
  <rect x="90" y="215" width="170" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="175" y="237" text-anchor="middle" font-size="14" fill="#2c3e50">STMT</text>

  <!-- COMMIT -->
  <rect x="90" y="260" width="170" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="175" y="282" text-anchor="middle" font-size="14" fill="#2c3e50">COMMIT</text>

  <!-- Divider line -->
  <line x1="350" y1="15" x2="350" y2="440" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Right Panel: Actual (Blackhole Engine) -->
  <text x="530" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Actual (Blackhole Engine):</text>
  <text x="530" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Two Transactions</text>

  <!-- First transaction box -->
  <rect x="420" y="62" width="220" height="148" rx="6" ry="6" fill="none" stroke="#4682B4" stroke-width="2.5"/>

  <!-- BEGIN -->
  <rect x="440" y="75" width="180" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="530" y="97" text-anchor="middle" font-size="14" fill="#2c3e50">BEGIN</text>

  <!-- dummy -->
  <rect x="440" y="120" width="180" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="530" y="142" text-anchor="middle" font-size="14" fill="#6c757d">dummy</text>

  <!-- COMMIT -->
  <rect x="440" y="165" width="180" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="530" y="187" text-anchor="middle" font-size="14" fill="#2c3e50">COMMIT</text>

  <!-- Red double-headed arrow between the two boxes -->
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#cc3333"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6" fill="#cc3333"/>
    </marker>
  </defs>

  <line x1="530" y1="218" x2="530" y2="260" stroke="#cc3333" stroke-width="2.5" marker-start="url(#arrowUp)" marker-end="url(#arrowDown)"/>
  <text x="625" y="235" text-anchor="middle" font-size="11" fill="#cc3333">Must execute</text>
  <text x="625" y="249" text-anchor="middle" font-size="11" fill="#cc3333">sequentially</text>

  <!-- Second transaction box -->
  <rect x="420" y="268" width="220" height="148" rx="6" ry="6" fill="none" stroke="#4682B4" stroke-width="2.5"/>

  <!-- BEGIN -->
  <rect x="440" y="281" width="180" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="530" y="303" text-anchor="middle" font-size="14" fill="#2c3e50">BEGIN</text>

  <!-- STMT -->
  <rect x="440" y="326" width="180" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="530" y="348" text-anchor="middle" font-size="14" fill="#2c3e50">STMT</text>

  <!-- COMMIT -->
  <rect x="440" y="371" width="180" height="34" rx="4" ry="4" fill="#eef2f7" stroke="#b0bec5" stroke-width="1"/>
  <text x="530" y="393" text-anchor="middle" font-size="14" fill="#2c3e50">COMMIT</text>

  <!-- Note below right panel -->
  <text x="530" y="440" text-anchor="middle" font-size="12" fill="#cc3333" font-style="italic">Requires thread lock in multi-threaded setting</text>
</svg>