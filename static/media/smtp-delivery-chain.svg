<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a9e6f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="260" fill="#fafbfc" rx="8"/>

  <!-- TLS zone background for port 587 hop -->
  <rect x="188" y="58" width="270" height="150" rx="8" fill="#e8f5ee" stroke="#4a9e6f" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="323" y="80" text-anchor="middle" font-size="11" fill="#3d8b5e" font-weight="600">STARTTLS Encrypted</text>

  <!-- Implicit TLS alternative label -->
  <rect x="188" y="218" width="270" height="30" rx="6" fill="#e8f5ee" stroke="#4a9e6f" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="323" y="238" text-anchor="middle" font-size="10" fill="#3d8b5e">Alt: Port 465 (Implicit TLS)</text>

  <!-- User node -->
  <rect x="30" y="100" width="120" height="56" rx="8" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <!-- Envelope icon -->
  <rect x="52" y="116" width="18" height="13" rx="2" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <polyline points="52,116 61,124 70,116" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="76" y="132" font-size="13" fill="#f1f5f9" font-weight="600">User</text>

  <!-- MSA node -->
  <rect x="228" y="100" width="190" height="56" rx="8" fill="#5b7a9d" stroke="#3e6085" stroke-width="1.5"/>
  <text x="323" y="124" text-anchor="middle" font-size="13" fill="#f1f5f9" font-weight="600">MSA</text>
  <text x="323" y="142" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Message Submission Agent</text>

  <!-- MTA 1 node -->
  <rect x="508" y="100" width="165" height="56" rx="8" fill="#5b7a9d" stroke="#3e6085" stroke-width="1.5"/>
  <text x="590" y="124" text-anchor="middle" font-size="13" fill="#f1f5f9" font-weight="600">MTA</text>
  <text x="590" y="142" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Message Transfer Agent</text>

  <!-- MTA 2 / Recipient Mailbox node -->
  <rect x="723" y="100" width="165" height="56" rx="8" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="805" y="120" text-anchor="middle" font-size="13" fill="#f1f5f9" font-weight="600">Recipient</text>
  <text x="805" y="138" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Mailbox</text>
  <!-- Small envelope icon -->
  <rect x="794" y="144" width="14" height="10" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <polyline points="794,144 801,150 808,144" fill="none" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Arrow: User → MSA -->
  <line x1="150" y1="128" x2="223" y2="128" stroke="#4a9e6f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="163" y="105" width="52" height="20" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="189" y="119" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">:587</text>

  <!-- Arrow: MSA → MTA 1 -->
  <line x1="418" y1="128" x2="503" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="438" y="105" width="44" height="20" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="460" y="119" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">:25</text>

  <!-- Arrow: MTA 1 → Recipient -->
  <line x1="673" y1="128" x2="718" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="678" y="105" width="44" height="20" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="700" y="119" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">:25</text>

  <!-- Legend -->
  <rect x="508" y="215" width="12" height="12" rx="2" fill="#e8f5ee" stroke="#4a9e6f" stroke-width="1"/>
  <text x="526" y="226" font-size="10.5" fill="#64748b">TLS-secured hop</text>
  <rect x="620" y="215" width="12" height="12" rx="2" fill="#5b7a9d"/>
  <text x="638" y="226" font-size="10.5" fill="#64748b">Mail agent</text>
</svg>