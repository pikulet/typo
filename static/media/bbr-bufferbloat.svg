<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1B2A4A"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="510" fill="white"/>

  <!-- ===== TOP DIAGRAM: Shallow Buffer ===== -->
  <text x="450" y="25" text-anchor="middle" fill="#1B2A4A" font-size="14" font-weight="bold">Shallow Buffer</text>

  <!-- "dropped" label -->
  <text x="473" y="48" text-anchor="middle" fill="#B33F40" font-size="10" font-weight="bold">dropped</text>

  <!-- Dropped packets (X marks) above buffer -->
  <!-- Packet 1 dropped -->
  <rect x="444" y="52" width="22" height="22" rx="2" fill="#C67A00" opacity="0.3" stroke="#C67A00" stroke-width="1"/>
  <g stroke="#B33F40" stroke-width="2.5" stroke-linecap="round">
    <line x1="448" y1="56" x2="462" y2="70"/>
    <line x1="462" y1="56" x2="448" y2="70"/>
  </g>
  <!-- Packet 2 dropped -->
  <rect x="480" y="52" width="22" height="22" rx="2" fill="#C67A00" opacity="0.3" stroke="#C67A00" stroke-width="1"/>
  <g stroke="#B33F40" stroke-width="2.5" stroke-linecap="round">
    <line x1="484" y1="56" x2="498" y2="70"/>
    <line x1="498" y1="56" x2="484" y2="70"/>
  </g>

  <!-- Sender node -->
  <rect x="60" y="80" width="120" height="50" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" fill="#1B2A4A" font-size="12">Sender</text>

  <!-- Arrow sender -> router -->
  <line x1="180" y1="105" x2="298" y2="105" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Router box -->
  <rect x="305" y="75" width="280" height="60" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="330" y="98" fill="#1B2A4A" font-size="11">Router</text>

  <!-- Buffer (shallow - small) -->
  <rect x="400" y="88" width="160" height="34" rx="3" fill="white" stroke="#4682B4" stroke-width="1.5"/>
  <!-- A few packet squares in buffer -->
  <rect x="404" y="92" width="26" height="26" rx="2" fill="#4682B4" opacity="0.6"/>
  <rect x="434" y="92" width="26" height="26" rx="2" fill="#4682B4" opacity="0.6"/>
  <rect x="464" y="92" width="26" height="26" rx="2" fill="#4682B4" opacity="0.4"/>
  <!-- Empty slots -->
  <rect x="494" y="92" width="26" height="26" rx="2" fill="#F0F4F8" stroke="#B0BEC5" stroke-width="1"/>
  <rect x="524" y="92" width="26" height="26" rx="2" fill="#F0F4F8" stroke="#B0BEC5" stroke-width="1"/>

  <!-- Arrow router -> receiver -->
  <line x1="585" y1="105" x2="698" y2="105" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Receiver node -->
  <rect x="705" y="80" width="120" height="50" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="765" y="110" text-anchor="middle" fill="#1B2A4A" font-size="12">Receiver</text>

  <!-- Shallow buffer annotation -->
  <rect x="120" y="152" width="650" height="28" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>
  <text x="445" y="170" text-anchor="middle" fill="#455A64" font-size="10">Transient burst causes packet loss even without real congestion. Sender halves rate unnecessarily.</text>

  <!-- Divider -->
  <line x1="60" y1="210" x2="840" y2="210" stroke="#D0D8E0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== BOTTOM DIAGRAM: Deep Buffer (Bufferbloat) ===== -->
  <text x="450" y="242" text-anchor="middle" fill="#1B2A4A" font-size="14" font-weight="bold">Deep Buffer (Bufferbloat)</text>

  <!-- Sender node -->
  <rect x="60" y="270" width="120" height="50" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="120" y="300" text-anchor="middle" fill="#1B2A4A" font-size="12">Sender</text>

  <!-- Arrow sender -> router -->
  <line x1="180" y1="295" x2="258" y2="295" stroke="#1B2A4A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Router box (larger to show deep buffer) -->
  <rect x="265" y="260" width="370" height="70" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="288" y="285" fill="#1B2A4A" font-size="11">Router</text>

  <!-- Buffer (deep - fully packed) -->
  <rect x="330" y="273" width="290" height="44" rx="3" fill="white" stroke="#B33F40" stroke-width="1.5"/>
  <!-- Many packed packet squares -->
  <rect x="334" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.7"/>
  <rect x="361" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.7"/>
  <rect x="388" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.7"/>
  <rect x="415" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.7"/>
  <rect x="442" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.7"/>
  <rect x="469" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.7"/>
  <rect x="496" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.65"/>
  <rect x="523" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.6"/>
  <rect x="550" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.55"/>
  <rect x="577" y="277" width="24" height="36" rx="2" fill="#C67A00" opacity="0.5"/>
  <rect x="595" y="277" width="20" height="36" rx="2" fill="#C67A00" opacity="0.45"/>

  <!-- "bufferbloat" label pointing to queue -->
  <line x1="475" y1="330" x2="475" y2="360" stroke="#B33F40" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="390" y="362" width="170" height="24" rx="4" fill="#FDF0F0" stroke="#B33F40" stroke-width="1"/>
  <text x="475" y="378" text-anchor="middle" fill="#B33F40" font-size="11" font-weight="bold">bufferbloat</text>

  <!-- Arrow router -> receiver (thin bottleneck) -->
  <line x1="635" y1="295" x2="698" y2="295" stroke="#1B2A4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="667" y="288" text-anchor="middle" fill="#5A6A7A" font-size="9">bottleneck</text>

  <!-- Receiver node -->
  <rect x="705" y="270" width="120" height="50" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="765" y="300" text-anchor="middle" fill="#1B2A4A" font-size="12">Receiver</text>

  <!-- Deep buffer annotation -->
  <rect x="120" y="410" width="650" height="28" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>
  <text x="445" y="428" text-anchor="middle" fill="#455A64" font-size="10">Congested queue fills buffer memory. No packet loss signal, but latency increases dramatically.</text>

  <!-- Summary annotation -->
  <rect x="120" y="455" width="650" height="28" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>
  <text x="445" y="473" text-anchor="middle" fill="#1B2A4A" font-size="10" font-weight="bold">Loss-based algorithms struggle in both scenarios. BBR avoids both by modelling bandwidth directly.</text>
</svg>