<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4682B4"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#B33F40"/>
    </marker>
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="740" height="400" fill="white"/>

  <!-- Title -->
  <text x="370" y="32" text-anchor="middle" fill="#1B2A4A" font-size="14" font-weight="bold">Cyclical Replication Problem</text>

  <!-- Node A -->
  <rect x="80" y="100" width="160" height="70" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="160" y="132" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="bold">Node A</text>
  <text x="160" y="152" text-anchor="middle" fill="#5A6A7A" font-size="10">executes tx</text>

  <!-- Node B -->
  <rect x="500" y="100" width="160" height="70" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="580" y="132" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="bold">Node B</text>
  <text x="580" y="152" text-anchor="middle" fill="#5A6A7A" font-size="10">replicates tx</text>

  <!-- Step 1: A -> B (tx) -->
  <line x1="240" y1="118" x2="492" y2="118" stroke="#4682B4" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="300" y="82" width="140" height="24" rx="3" fill="white" stroke="#4682B4" stroke-width="1"/>
  <text x="370" y="98" text-anchor="middle" fill="#4682B4" font-size="11" font-weight="bold">1  tx (original)</text>

  <!-- Step 2: B -> A (tx_copy) -->
  <line x1="500" y1="152" x2="248" y2="152" stroke="#2E7D32" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="305" y="158" width="130" height="24" rx="3" fill="white" stroke="#2E7D32" stroke-width="1"/>
  <text x="370" y="174" text-anchor="middle" fill="#2E7D32" font-size="11" font-weight="bold">2  tx_copy</text>

  <!-- Step 3: Loop - A tries to re-replicate -->
  <path d="M 160 170 C 160 260, 60 260, 60 135 C 60 70, 100 60, 160 100" fill="none" stroke="#B33F40" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>

  <!-- Loop label -->
  <rect x="12" y="213" width="118" height="44" rx="3" fill="#FFF0F0" stroke="#B33F40" stroke-width="1.5"/>
  <text x="71" y="230" text-anchor="middle" fill="#B33F40" font-size="10" font-weight="bold">3  A re-replicates</text>
  <text x="71" y="246" text-anchor="middle" fill="#B33F40" font-size="10">tx_copy (loop!)</text>

  <!-- Detection box -->
  <rect x="160" y="290" width="420" height="80" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>
  <text x="370" y="314" text-anchor="middle" fill="#1B2A4A" font-size="12" font-weight="bold">Loop Detection Required</text>
  <text x="370" y="334" text-anchor="middle" fill="#455A64" font-size="11">A must distinguish tx_copy from a new transaction.</text>
  <text x="370" y="352" text-anchor="middle" fill="#455A64" font-size="11">Methods: dummy statement (binlog) or GTID-based (UUID).</text>
</svg>