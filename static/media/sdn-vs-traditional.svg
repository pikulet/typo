<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <marker id="arrow-of" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <path d="M0,6 L8,6 L4,0 Z" fill="#4682B4"/>
    </marker>
    <marker id="arrow-ofd" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,6 Z" fill="#4682B4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="white"/>

  <!-- Divider -->
  <line x1="450" y1="20" x2="450" y2="380" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="450" y="15" text-anchor="middle" fill="#B0BEC5" font-size="10">vs</text>

  <!-- ============== LEFT PANEL: Traditional ============== -->
  <text x="225" y="45" text-anchor="middle" fill="#C67A00" font-size="15" font-weight="bold">Traditional Switch</text>

  <!-- Single monolithic switch block -->
  <rect x="80" y="80" width="290" height="220" rx="4" fill="white" stroke="#C67A00" stroke-width="2.5"/>

  <!-- Internal coupling bar -->
  <rect x="80" y="80" width="290" height="220" rx="4" fill="none" stroke="#C67A00" stroke-width="2.5"/>

  <!-- Control plane layer (top half) -->
  <rect x="95" y="95" width="260" height="85" rx="4" fill="#FFF3E0" stroke="#C67A00" stroke-width="1.5"/>
  <text x="225" y="130" text-anchor="middle" fill="#C67A00" font-size="12" font-weight="bold">Control Plane</text>
  <text x="225" y="150" text-anchor="middle" fill="#8B6914" font-size="10">Routing logic</text>
  <text x="225" y="164" text-anchor="middle" fill="#8B6914" font-size="10">(embedded in hardware)</text>

  <!-- Tight coupling indicator -->
  <rect x="170" y="180" width="110" height="18" rx="3" fill="#C67A00"/>
  <text x="225" y="193" text-anchor="middle" fill="white" font-size="9" font-weight="bold">TIGHTLY COUPLED</text>

  <!-- Data plane layer (bottom half) -->
  <rect x="95" y="200" width="260" height="85" rx="4" fill="#FFF8F0" stroke="#C67A00" stroke-width="1.5"/>
  <text x="225" y="235" text-anchor="middle" fill="#C67A00" font-size="12" font-weight="bold">Data Plane</text>
  <text x="225" y="255" text-anchor="middle" fill="#8B6914" font-size="10">Packet forwarding</text>
  <text x="225" y="269" text-anchor="middle" fill="#8B6914" font-size="10">(fixed forwarding tables)</text>

  <!-- Label beneath -->
  <text x="225" y="325" text-anchor="middle" fill="#5A6A7A" font-size="10">Fixed forwarding tables,</text>
  <text x="225" y="340" text-anchor="middle" fill="#5A6A7A" font-size="10">hardware-burned logic.</text>
  <text x="225" y="358" text-anchor="middle" fill="#B33F40" font-size="10" font-weight="bold">Each switch decides independently.</text>

  <!-- ============== RIGHT PANEL: SDN ============== -->
  <text x="675" y="45" text-anchor="middle" fill="#4682B4" font-size="15" font-weight="bold">SDN Architecture</text>

  <!-- Separate controller box (control plane) -->
  <rect x="560" y="70" width="230" height="75" rx="4" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="2"/>
  <text x="675" y="100" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Control Plane</text>
  <text x="675" y="118" text-anchor="middle" fill="#A0B4CC" font-size="10">SDN Controller (software)</text>
  <text x="675" y="132" text-anchor="middle" fill="#A0B4CC" font-size="10">Centralised routing decisions</text>

  <!-- OpenFlow arrows -->
  <line x1="665" y1="145" x2="665" y2="210" stroke="#4682B4" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-ofd)"/>
  <line x1="685" y1="210" x2="685" y2="145" stroke="#4682B4" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-of)"/>

  <!-- OpenFlow label -->
  <rect x="698" y="165" width="90" height="20" rx="3" fill="white" stroke="#4682B4" stroke-width="1.5"/>
  <text x="743" y="179" text-anchor="middle" fill="#4682B4" font-size="10" font-weight="bold">OpenFlow</text>

  <!-- Data plane only switch -->
  <rect x="560" y="218" width="230" height="85" rx="4" fill="white" stroke="#4682B4" stroke-width="2.5"/>
  <text x="675" y="250" text-anchor="middle" fill="#1B2A4A" font-size="12" font-weight="bold">Data Plane</text>
  <text x="675" y="270" text-anchor="middle" fill="#4682B4" font-size="10">Packet forwarding</text>
  <text x="675" y="284" text-anchor="middle" fill="#4682B4" font-size="10">(programmable flow tables)</text>

  <!-- Label beneath -->
  <text x="675" y="325" text-anchor="middle" fill="#5A6A7A" font-size="10">Programmable forwarding,</text>
  <text x="675" y="340" text-anchor="middle" fill="#5A6A7A" font-size="10">centralised control.</text>
  <text x="675" y="358" text-anchor="middle" fill="#2E7D32" font-size="10" font-weight="bold">Controller coordinates all switches.</text>

  <!-- Annotation -->
  <rect x="100" y="380" width="700" height="30" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>
  <text x="450" y="400" text-anchor="middle" fill="#455A64" font-size="10">SDN decouples the control plane from the data plane, moving routing decisions to a centralised software controller.</text>
</svg>