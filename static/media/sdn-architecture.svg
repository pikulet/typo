<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <marker id="arrow-down" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,6 Z" fill="#4682B4"/>
    </marker>
    <marker id="arrow-up" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <path d="M0,6 L8,6 L4,0 Z" fill="#4682B4"/>
    </marker>
    <marker id="arrow-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1B2A4A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="white"/>

  <!-- === CONTROL PLANE tier === -->
  <rect x="40" y="20" width="820" height="110" rx="4" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2"/>
  <text x="60" y="46" fill="#1B2A4A" font-size="12" font-weight="bold">CONTROL PLANE</text>

  <!-- SDN Controller box -->
  <rect x="310" y="55" width="280" height="55" rx="4" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SDN Controller (POX)</text>
  <text x="450" y="97" text-anchor="middle" fill="#A0B4CC" font-size="10">Python-based, centralised logic</text>

  <!-- === OPENFLOW arrows === -->
  <!-- Four pairs of arrows from controller down to each switch -->
  <line x1="225" y1="130" x2="225" y2="195" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="215" y1="195" x2="215" y2="130" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-up)"/>

  <line x1="395" y1="130" x2="395" y2="195" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="385" y1="195" x2="385" y2="130" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-up)"/>

  <line x1="515" y1="130" x2="515" y2="195" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="505" y1="195" x2="505" y2="130" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-up)"/>

  <line x1="685" y1="130" x2="685" y2="195" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="675" y1="195" x2="675" y2="130" stroke="#4682B4" stroke-width="2" marker-end="url(#arrow-up)"/>

  <!-- OpenFlow label -->
  <rect x="375" y="150" width="150" height="22" rx="3" fill="white" stroke="#4682B4" stroke-width="1.5"/>
  <text x="450" y="165" text-anchor="middle" fill="#4682B4" font-size="11" font-weight="bold">OpenFlow API</text>

  <!-- === DATA PLANE tier === -->
  <rect x="40" y="200" width="820" height="300" rx="4" fill="#F7F9FC" stroke="#1B2A4A" stroke-width="2"/>
  <text x="60" y="226" fill="#1B2A4A" font-size="12" font-weight="bold">DATA PLANE</text>

  <!-- Switch 1 -->
  <rect x="150" y="240" width="140" height="70" rx="4" fill="white" stroke="#4682B4" stroke-width="2"/>
  <text x="220" y="265" text-anchor="middle" fill="#1B2A4A" font-size="12" font-weight="bold">Switch s1</text>
  <rect x="170" y="278" width="100" height="20" rx="3" fill="#DAE5F0" stroke="#4682B4" stroke-width="1"/>
  <text x="220" y="292" text-anchor="middle" fill="#2C5282" font-size="9">Flow Table</text>

  <!-- Switch 2 -->
  <rect x="320" y="240" width="140" height="70" rx="4" fill="white" stroke="#4682B4" stroke-width="2"/>
  <text x="390" y="265" text-anchor="middle" fill="#1B2A4A" font-size="12" font-weight="bold">Switch s2</text>
  <rect x="340" y="278" width="100" height="20" rx="3" fill="#DAE5F0" stroke="#4682B4" stroke-width="1"/>
  <text x="390" y="292" text-anchor="middle" fill="#2C5282" font-size="9">Flow Table</text>

  <!-- Switch 3 -->
  <rect x="490" y="240" width="140" height="70" rx="4" fill="white" stroke="#4682B4" stroke-width="2"/>
  <text x="560" y="265" text-anchor="middle" fill="#1B2A4A" font-size="12" font-weight="bold">Switch s3</text>
  <rect x="510" y="278" width="100" height="20" rx="3" fill="#DAE5F0" stroke="#4682B4" stroke-width="1"/>
  <text x="560" y="292" text-anchor="middle" fill="#2C5282" font-size="9">Flow Table</text>

  <!-- Switch 4 -->
  <rect x="660" y="240" width="140" height="70" rx="4" fill="white" stroke="#4682B4" stroke-width="2"/>
  <text x="730" y="265" text-anchor="middle" fill="#1B2A4A" font-size="12" font-weight="bold">Switch s4</text>
  <rect x="680" y="278" width="100" height="20" rx="3" fill="#DAE5F0" stroke="#4682B4" stroke-width="1"/>
  <text x="730" y="292" text-anchor="middle" fill="#2C5282" font-size="9">Flow Table</text>

  <!-- Inter-switch links -->
  <line x1="290" y1="275" x2="320" y2="275" stroke="#1B2A4A" stroke-width="1.5"/>
  <line x1="460" y1="275" x2="490" y2="275" stroke="#1B2A4A" stroke-width="1.5"/>
  <line x1="630" y1="275" x2="660" y2="275" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- Host nodes -->
  <!-- h1 under s1 -->
  <line x1="190" y1="310" x2="190" y2="360" stroke="#1B2A4A" stroke-width="1.5"/>
  <circle cx="190" cy="375" r="18" fill="white" stroke="#2E7D32" stroke-width="2"/>
  <text x="190" y="379" text-anchor="middle" fill="#2E7D32" font-size="10" font-weight="bold">h1</text>

  <!-- h2 under s1 -->
  <line x1="250" y1="310" x2="250" y2="360" stroke="#1B2A4A" stroke-width="1.5"/>
  <circle cx="250" cy="375" r="18" fill="white" stroke="#2E7D32" stroke-width="2"/>
  <text x="250" y="379" text-anchor="middle" fill="#2E7D32" font-size="10" font-weight="bold">h2</text>

  <!-- h3 under s3 -->
  <line x1="530" y1="310" x2="530" y2="360" stroke="#1B2A4A" stroke-width="1.5"/>
  <circle cx="530" cy="375" r="18" fill="white" stroke="#2E7D32" stroke-width="2"/>
  <text x="530" y="379" text-anchor="middle" fill="#2E7D32" font-size="10" font-weight="bold">h3</text>

  <!-- h4 under s4 -->
  <line x1="730" y1="310" x2="730" y2="360" stroke="#1B2A4A" stroke-width="1.5"/>
  <circle cx="730" cy="375" r="18" fill="white" stroke="#2E7D32" stroke-width="2"/>
  <text x="730" y="379" text-anchor="middle" fill="#2E7D32" font-size="10" font-weight="bold">h4</text>

  <!-- Legend -->
  <rect x="100" y="420" width="700" height="70" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>

  <!-- Legend: controller -->
  <rect x="130" y="438" width="16" height="12" rx="2" fill="#1B2A4A"/>
  <text x="155" y="449" fill="#455A64" font-size="10">SDN Controller</text>

  <!-- Legend: switch -->
  <rect x="290" y="438" width="16" height="12" rx="2" fill="white" stroke="#4682B4" stroke-width="1.5"/>
  <text x="315" y="449" fill="#455A64" font-size="10">Switch (with Flow Table)</text>

  <!-- Legend: host -->
  <circle cx="510" cy="444" r="7" fill="white" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="525" y="449" fill="#455A64" font-size="10">Host</text>

  <!-- Legend: openflow -->
  <line x1="620" y1="444" x2="650" y2="444" stroke="#4682B4" stroke-width="2"/>
  <text x="660" y="449" fill="#455A64" font-size="10">OpenFlow channel</text>

  <text x="450" y="478" text-anchor="middle" fill="#5A6A7A" font-size="10">The controller programs flow tables in each switch via OpenFlow, determining how packets are forwarded.</text>
</svg>