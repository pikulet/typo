<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #1e293b; letter-spacing: 0.02em; }
      .col-heading { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; }
      .example { font-size: 12px; font-style: italic; fill: #334155; }
      .label { font-size: 12px; font-weight: 600; fill: #475569; }
      .value { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" class="title">Performative vs. Constative Utterances</text>
  <line x1="200" y1="50" x2="520" y2="50" stroke="#94a3b8" stroke-width="0.5"/>

  <!-- Dividing line -->
  <line x1="360" y1="65" x2="360" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- LEFT COLUMN: Performative -->
  <rect x="24" y="70" width="320" height="44" rx="6" fill="#475569"/>
  <text x="184" y="97" text-anchor="middle" class="col-heading" fill="#e2e8f0">PERFORMATIVE</text>

  <!-- Performative example card -->
  <rect x="32" y="128" width="304" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>
  <text x="184" y="147" text-anchor="middle" class="example">"I suggest electing Martin"</text>
  <text x="184" y="163" text-anchor="middle" style="font-size:10px; fill:#64748b;">-- Teacher, The Simpsons</text>

  <!-- Performative properties -->
  <rect x="32" y="186" width="304" height="180" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>

  <circle cx="56" cy="216" r="6" fill="#475569"/>
  <text x="72" y="220" class="label">Nature</text>
  <text x="72" y="238" class="value">The saying IS the doing</text>

  <line x1="48" y1="252" x2="320" y2="252" stroke="#e2e8f0" stroke-width="1"/>

  <circle cx="56" cy="274" r="6" fill="#475569"/>
  <text x="72" y="278" class="label">Truth value</text>
  <text x="72" y="296" class="value">Cannot be true or false</text>

  <line x1="48" y1="310" x2="320" y2="310" stroke="#e2e8f0" stroke-width="1"/>

  <circle cx="56" cy="332" r="6" fill="#475569"/>
  <text x="72" y="336" class="label">Judged by</text>
  <rect x="72" y="346" width="72" height="22" rx="4" fill="#475569"/>
  <text x="108" y="361" text-anchor="middle" style="font-size:11px; font-weight:600; fill:#f8fafc;">Felicity</text>

  <!-- RIGHT COLUMN: Constative -->
  <rect x="376" y="70" width="320" height="44" rx="6" fill="#b45309"/>
  <text x="536" y="97" text-anchor="middle" class="col-heading" fill="#fef3c7">CONSTATIVE</text>

  <!-- Constative example card -->
  <rect x="384" y="128" width="304" height="44" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="0.5"/>
  <text x="536" y="147" text-anchor="middle" class="example">"Martin is aware of</text>
  <text x="536" y="163" text-anchor="middle" class="example">Bradbury's work"</text>

  <!-- Constative properties -->
  <rect x="384" y="186" width="304" height="180" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.5"/>

  <circle cx="408" cy="216" r="6" fill="#b45309"/>
  <text x="424" y="220" class="label">Nature</text>
  <text x="424" y="238" class="value">Describes a state of affairs</text>

  <line x1="400" y1="252" x2="672" y2="252" stroke="#fde68a" stroke-width="1"/>

  <circle cx="408" cy="274" r="6" fill="#b45309"/>
  <text x="424" y="278" class="label">Truth value</text>
  <text x="424" y="296" class="value">Can be true or false</text>

  <line x1="400" y1="310" x2="672" y2="310" stroke="#fde68a" stroke-width="1"/>

  <circle cx="408" cy="332" r="6" fill="#b45309"/>
  <text x="424" y="336" class="label">Judged by</text>
  <rect x="424" y="346" width="96" height="22" rx="4" fill="#b45309"/>
  <text x="472" y="361" text-anchor="middle" style="font-size:11px; font-weight:600; fill:#fef3c7;">Truth value</text>
</svg>