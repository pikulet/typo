<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .track-label { font-size: 15px; font-weight: 600; fill: #4a4a4a; }
      .milestone-text { font-size: 12.5px; fill: #555; }
      .note-text { font-size: 11px; fill: #7a8a9a; font-style: italic; }
      .tom-label { font-size: 14px; font-weight: 600; fill: #fff; }
      .icon-label { font-size: 11px; fill: #5a6a7a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="#fafafa" rx="8"/>

  <!-- ==================== LEFT TRACK ==================== -->
  <!-- Track background -->
  <rect x="40" y="30" width="220" height="530" rx="12" fill="#edf2f7" stroke="#d0dbe6" stroke-width="1"/>

  <!-- Label -->
  <text x="150" y="62" text-anchor="middle" class="track-label" fill="#3b6ea5">Neurotypical Child</text>

  <!-- Child icon -->
  <circle cx="115" cy="130" r="18" fill="#7ea8cc" stroke="#5a8ab5" stroke-width="1.5"/>
  <circle cx="115" cy="118" r="7" fill="#fff"/>
  <rect x="107" y="127" width="16" height="18" rx="4" fill="#fff"/>

  <!-- Caregiver icon -->
  <circle cx="185" cy="122" r="22" fill="#9ab3c9" stroke="#7a9bb5" stroke-width="1.5"/>
  <circle cx="185" cy="108" r="8" fill="#fff"/>
  <rect x="176" y="118" width="18" height="22" rx="4" fill="#fff"/>

  <!-- Label under icons -->
  <text x="115" y="170" text-anchor="middle" class="icon-label">Child</text>
  <text x="185" y="170" text-anchor="middle" class="icon-label">Caregiver</text>

  <!-- Arrow down -->
  <line x1="150" y1="185" x2="150" y2="460" stroke="#7ea8cc" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="144,455 150,470 156,455" fill="#7ea8cc"/>

  <!-- ToM box -->
  <rect x="60" y="478" width="180" height="50" rx="8" fill="#3b6ea5"/>
  <text x="150" y="500" text-anchor="middle" class="tom-label" font-size="12">Theory of Mind</text>
  <text x="150" y="516" text-anchor="middle" class="tom-label" font-size="12">Development</text>

  <!-- ==================== RIGHT TRACK ==================== -->
  <!-- Track background -->
  <rect x="540" y="30" width="220" height="530" rx="12" fill="#f5f0eb" stroke="#ddd3c8" stroke-width="1"/>

  <!-- Label -->
  <text x="650" y="62" text-anchor="middle" class="track-label" fill="#8a7560">Autistic Child</text>

  <!-- Child icon -->
  <circle cx="610" cy="130" r="18" fill="#c9a87a" stroke="#b5956a" stroke-width="1.5"/>
  <circle cx="610" cy="118" r="7" fill="#fff"/>
  <rect x="602" y="127" width="16" height="18" rx="4" fill="#fff"/>

  <!-- Robot (SAR) icon -->
  <rect x="662" y="104" width="36" height="30" rx="6" fill="#9ab3c9" stroke="#7a9bb5" stroke-width="1.5"/>
  <!-- Robot eyes -->
  <circle cx="673" cy="117" r="3.5" fill="#fff"/>
  <circle cx="687" cy="117" r="3.5" fill="#fff"/>
  <!-- Robot antenna -->
  <line x1="680" y1="104" x2="680" y2="94" stroke="#7a9bb5" stroke-width="2"/>
  <circle cx="680" cy="91" r="3" fill="#7a9bb5"/>
  <!-- Robot body -->
  <rect x="666" y="136" width="28" height="18" rx="4" fill="#9ab3c9" stroke="#7a9bb5" stroke-width="1.5"/>

  <!-- Label under icons -->
  <text x="610" y="170" text-anchor="middle" class="icon-label">Child</text>
  <text x="680" y="170" text-anchor="middle" class="icon-label">SAR</text>

  <!-- Note near robot -->
  <rect x="580" y="192" width="148" height="32" rx="6" fill="#fff" stroke="#ddd3c8" stroke-width="1"/>
  <text x="654" y="206" text-anchor="middle" class="note-text">"simpler, predictable</text>
  <text x="654" y="219" text-anchor="middle" class="note-text">behaviour"</text>

  <!-- Arrow down -->
  <line x1="650" y1="230" x2="650" y2="460" stroke="#c9a87a" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="644,455 650,470 656,455" fill="#c9a87a"/>

  <!-- ToM box -->
  <rect x="560" y="478" width="180" height="50" rx="8" fill="#8a7560"/>
  <text x="650" y="500" text-anchor="middle" class="tom-label" font-size="12">Theory of Mind</text>
  <text x="650" y="516" text-anchor="middle" class="tom-label" font-size="12">Development</text>

  <!-- ==================== CENTER MILESTONES ==================== -->
  <text x="400" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#4a4a4a">Shared Developmental Milestones</text>

  <!-- Milestone 1 -->
  <rect x="290" y="285" width="220" height="42" rx="8" fill="#fff" stroke="#c0cdd8" stroke-width="1.2"/>
  <text x="400" y="302" text-anchor="middle" class="milestone-text">Understanding others have</text>
  <text x="400" y="318" text-anchor="middle" class="milestone-text">independent thoughts</text>

  <!-- Milestone 2 -->
  <rect x="290" y="340" width="220" height="36" rx="8" fill="#fff" stroke="#c0cdd8" stroke-width="1.2"/>
  <text x="400" y="363" text-anchor="middle" class="milestone-text">Recognizing emotions</text>

  <!-- Milestone 3 -->
  <rect x="290" y="389" width="220" height="36" rx="8" fill="#fff" stroke="#c0cdd8" stroke-width="1.2"/>
  <text x="400" y="412" text-anchor="middle" class="milestone-text">Inferring intentions</text>

  <!-- Connecting lines from left track to milestones -->
  <line x1="260" y1="306" x2="290" y2="306" stroke="#b0c4d6" stroke-width="1.2"/>
  <line x1="260" y1="358" x2="290" y2="358" stroke="#b0c4d6" stroke-width="1.2"/>
  <line x1="260" y1="407" x2="290" y2="407" stroke="#b0c4d6" stroke-width="1.2"/>

  <!-- Connecting lines from right track to milestones -->
  <line x1="510" y1="306" x2="540" y2="306" stroke="#d6c8b6" stroke-width="1.2"/>
  <line x1="510" y1="358" x2="540" y2="358" stroke="#d6c8b6" stroke-width="1.2"/>
  <line x1="510" y1="407" x2="540" y2="407" stroke="#d6c8b6" stroke-width="1.2"/>

  <!-- Small dots at connection points -->
  <circle cx="260" cy="306" r="3" fill="#b0c4d6"/>
  <circle cx="260" cy="358" r="3" fill="#b0c4d6"/>
  <circle cx="260" cy="407" r="3" fill="#b0c4d6"/>
  <circle cx="540" cy="306" r="3" fill="#d6c8b6"/>
  <circle cx="540" cy="358" r="3" fill="#d6c8b6"/>
  <circle cx="540" cy="407" r="3" fill="#d6c8b6"/>

  <!-- ==================== BOTTOM CONNECTOR ==================== -->
  <!-- Curved line connecting both ToM boxes through a shared idea -->
  <rect x="275" y="488" width="250" height="32" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="509" text-anchor="middle" font-size="11" fill="#777">Same goal, different mentors</text>

  <!-- Connecting dashes from center label to both boxes -->
  <line x1="275" y1="504" x2="240" y2="504" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="525" y1="504" x2="560" y2="504" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ==================== TITLE ==================== -->
  <text x="400" y="590" text-anchor="middle" font-size="11" fill="#999">Parallel paths to Theory of Mind development</text>
</svg>