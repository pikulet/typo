<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Courier New', Courier, monospace">
  <defs>
    <style>
      .title { font-size: 14px; font-weight: bold; fill: #1e293b; }
      .label { font-size: 11px; fill: #334155; }
      .label-small { font-size: 10px; fill: #64748b; }
      .warn { font-size: 10px; fill: #92400e; }
      .box-fill { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
      .client-fill { fill: #e2e8f0; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .resolver-fill { fill: #e2e8f0; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .observer-fill { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 6; }
      .observer-safe { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .arrow { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-enc { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); stroke-dasharray: 6,3; }
      .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4,4; }
      .section-bg-left { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .section-bg-right { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .warn-box { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1; rx: 4; }
      .visible-text { font-size: 10px; fill: #dc2626; font-weight: bold; }
      .hidden-text { font-size: 10px; fill: #16a34a; font-weight: bold; }
      .port-label { font-size: 9px; fill: #6b7280; }
      .eye { fill: #92400e; }
      .eye-muted { fill: #94a3b8; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Section backgrounds -->
  <rect class="section-bg-left" x="10" y="10" width="420" height="400"/>
  <rect class="section-bg-right" x="450" y="10" width="420" height="400"/>

  <!-- LEFT SIDE: Traditional DNS -->
  <text class="title" x="220" y="40" text-anchor="middle">Traditional DNS</text>
  <line x1="145" y1="48" x2="295" y2="48" stroke="#94a3b8" stroke-width="1"/>

  <!-- Client box -->
  <rect class="client-fill" x="40" y="100" width="100" height="50"/>
  <text class="label" x="90" y="122" text-anchor="middle">Client</text>
  <text class="port-label" x="90" y="135" text-anchor="middle">App</text>

  <!-- DNS Resolver box -->
  <rect class="resolver-fill" x="300" y="100" width="110" height="50"/>
  <text class="label" x="355" y="122" text-anchor="middle">DNS</text>
  <text class="label" x="355" y="135" text-anchor="middle">Resolver</text>

  <!-- Arrow: plaintext query -->
  <line class="arrow" x1="140" y1="118" x2="298" y2="118"/>
  <text class="label-small" x="220" y="110" text-anchor="middle">Plaintext UDP query</text>
  <text class="port-label" x="220" y="98" text-anchor="middle">Port 53</text>

  <!-- Arrow: plaintext response -->
  <line class="arrow" x1="300" y1="138" x2="142" y2="138"/>
  <text class="label-small" x="220" y="160" text-anchor="middle">Plaintext response</text>

  <!-- Observer box (amber) -->
  <rect class="observer-fill" x="120" y="210" width="200" height="90"/>

  <!-- Eye icon (simple) -->
  <g transform="translate(210, 232)">
    <ellipse class="eye" cx="0" cy="0" rx="12" ry="7" fill="none" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#92400e"/>
  </g>
  <text class="label" x="220" y="252" text-anchor="middle">ISP / Network</text>
  <text class="label" x="220" y="264" text-anchor="middle">Observer</text>

  <text class="visible-text" x="220" y="286" text-anchor="middle">CAN SEE:</text>
  <text class="warn" x="220" y="298" text-anchor="middle">"example.com" query</text>

  <!-- Dotted line from observer to arrow -->
  <line x1="220" y1="160" x2="220" y2="210" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Summary label -->
  <rect fill="#fef2f2" stroke="#fca5a5" stroke-width="1" rx="4" x="95" y="330" width="250" height="50"/>
  <text class="label-small" x="220" y="350" text-anchor="middle" fill="#991b1b" font-weight="bold">All DNS queries visible</text>
  <text class="label-small" x="220" y="365" text-anchor="middle" fill="#991b1b">to anyone on the network path</text>

  <!-- DIVIDER -->
  <line class="divider" x1="440" y1="20" x2="440" y2="400"/>

  <!-- RIGHT SIDE: DNS-over-HTTPS -->
  <text class="title" x="660" y="40" text-anchor="middle">DNS-over-HTTPS (DoH)</text>
  <line x1="560" y1="48" x2="760" y2="48" stroke="#94a3b8" stroke-width="1"/>

  <!-- Client box -->
  <rect class="client-fill" x="480" y="100" width="100" height="50"/>
  <text class="label" x="530" y="122" text-anchor="middle">Client</text>
  <text class="port-label" x="530" y="135" text-anchor="middle">App</text>

  <!-- DoH Resolver box -->
  <rect class="resolver-fill" x="740" y="100" width="110" height="50"/>
  <text class="label" x="795" y="122" text-anchor="middle">DoH</text>
  <text class="label" x="795" y="135" text-anchor="middle">Resolver</text>

  <!-- Arrow: encrypted query -->
  <line class="arrow-enc" x1="580" y1="118" x2="738" y2="118"/>
  <text class="label-small" x="660" y="110" text-anchor="middle" fill="#2563eb">Encrypted HTTPS</text>
  <text class="port-label" x="660" y="98" text-anchor="middle">Port 443 (TLS)</text>

  <!-- Arrow: encrypted response -->
  <line class="arrow-enc" x1="740" y1="138" x2="582" y2="138"/>
  <text class="label-small" x="660" y="160" text-anchor="middle" fill="#2563eb">Encrypted response</text>

  <!-- Lock icon (simple) -->
  <g transform="translate(650, 125)">
    <rect x="-5" y="0" width="10" height="8" rx="1" fill="#2563eb"/>
    <path d="M-3,0 L-3,-4 A3,3 0 0,1 3,-4 L3,0" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Observer box (muted/gray) -->
  <rect class="observer-safe" x="560" y="210" width="200" height="90"/>

  <!-- Eye icon (muted) -->
  <g transform="translate(650, 232)">
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#94a3b8"/>
    <!-- Strike-through -->
    <line x1="-14" y1="9" x2="14" y2="-9" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text class="label" x="660" y="252" text-anchor="middle">ISP / Network</text>
  <text class="label" x="660" y="264" text-anchor="middle">Observer</text>

  <text class="hidden-text" x="660" y="286" text-anchor="middle">CANNOT READ:</text>
  <text class="label-small" x="660" y="298" text-anchor="middle">DNS query contents</text>

  <!-- Dotted line from observer to arrow -->
  <line x1="660" y1="160" x2="660" y2="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Warning note -->
  <rect class="warn-box" x="490" y="325" width="340" height="65"/>
  <text class="warn" x="510" y="343" font-weight="bold">But ISP can still see:</text>
  <text class="warn" x="510" y="358">- Destination IP of the DoH resolver</text>
  <text class="warn" x="510" y="373">- SNI field in TLS handshake (hostname)</text>
  <text class="warn" x="510" y="386" fill="#b45309" font-style="italic">DNS query is hidden, but not the destination</text>
</svg>