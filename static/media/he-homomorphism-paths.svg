<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a7c59"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a6fa5"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b8860b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" rx="8" fill="#fafaf8" stroke="#ddd" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Homomorphism: Both paths produce the same result</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- PATH 1: Compute then Encrypt (top)         -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Path 1 label -->
  <text x="30" y="82" font-size="12" font-weight="600" fill="#4a7c59" letter-spacing="0.5">PATH 1</text>
  <text x="30" y="98" font-size="11" fill="#4a7c59">Compute then Encrypt</text>

  <!-- Plaintext a -->
  <rect x="30" y="115" width="100" height="42" rx="6" fill="#e8f0e4" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="80" y="140" text-anchor="middle" font-size="13" fill="#2d4a2e" font-weight="500">Plaintext a</text>

  <!-- Plaintext b -->
  <rect x="30" y="170" width="100" height="42" rx="6" fill="#e8f0e4" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="80" y="195" text-anchor="middle" font-size="13" fill="#2d4a2e" font-weight="500">Plaintext b</text>

  <!-- Arrows from a and b to Add -->
  <line x1="130" y1="136" x2="188" y2="158" stroke="#4a7c59" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="130" y1="191" x2="188" y2="168" stroke="#4a7c59" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Add operation (plaintext) -->
  <rect x="196" y="140" width="80" height="42" rx="20" fill="#d4e6ca" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="236" y="165" text-anchor="middle" font-size="13" fill="#2d4a2e" font-weight="600">Add</text>

  <!-- Arrow to result -->
  <line x1="276" y1="161" x2="318" y2="161" stroke="#4a7c59" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Result (a+b) -->
  <rect x="326" y="140" width="100" height="42" rx="6" fill="#e8f0e4" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="376" y="165" text-anchor="middle" font-size="13" fill="#2d4a2e" font-weight="500">a + b</text>

  <!-- Arrow to Encrypt -->
  <line x1="426" y1="161" x2="468" y2="161" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Encrypt operation -->
  <rect x="476" y="140" width="90" height="42" rx="20" fill="#d4dff0" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="521" y="165" text-anchor="middle" font-size="13" fill="#2c4a6e" font-weight="600">Encrypt</text>

  <!-- Arrow to Enc(a+b) top -->
  <line x1="566" y1="161" x2="618" y2="161" stroke="#b8860b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Enc(a+b) — Path 1 result -->
  <rect x="626" y="135" width="130" height="50" rx="6" fill="#fdf3e0" stroke="#b8860b" stroke-width="2"/>
  <text x="691" y="165" text-anchor="middle" font-size="14" fill="#7a5a00" font-weight="600">Enc(a + b)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Equals sign connecting the two results     -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Vertical connector lines -->
  <line x1="691" y1="185" x2="691" y2="220" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Equals badge -->
  <rect x="665" y="220" width="52" height="30" rx="15" fill="#b8860b"/>
  <text x="691" y="241" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">=</text>

  <line x1="691" y1="250" x2="691" y2="280" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- PATH 2: Encrypt then Compute (bottom)      -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Path 2 label -->
  <text x="30" y="276" font-size="12" font-weight="600" fill="#4a6fa5" letter-spacing="0.5">PATH 2</text>
  <text x="30" y="292" font-size="11" fill="#4a6fa5">Encrypt then Compute</text>

  <!-- Plaintext a -->
  <rect x="30" y="305" width="100" height="42" rx="6" fill="#e8f0e4" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="80" y="330" text-anchor="middle" font-size="13" fill="#2d4a2e" font-weight="500">Plaintext a</text>

  <!-- Plaintext b -->
  <rect x="30" y="360" width="100" height="42" rx="6" fill="#e8f0e4" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="80" y="385" text-anchor="middle" font-size="13" fill="#2d4a2e" font-weight="500">Plaintext b</text>

  <!-- Arrow from a to Encrypt a -->
  <line x1="130" y1="326" x2="178" y2="326" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Arrow from b to Encrypt b -->
  <line x1="130" y1="381" x2="178" y2="381" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Encrypt a -->
  <rect x="186" y="305" width="90" height="42" rx="20" fill="#d4dff0" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="231" y="330" text-anchor="middle" font-size="13" fill="#2c4a6e" font-weight="600">Encrypt</text>

  <!-- Encrypt b -->
  <rect x="186" y="360" width="90" height="42" rx="20" fill="#d4dff0" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="231" y="385" text-anchor="middle" font-size="13" fill="#2c4a6e" font-weight="600">Encrypt</text>

  <!-- Arrow from Enc(a) to Enc(a) box -->
  <line x1="276" y1="326" x2="318" y2="326" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="276" y1="381" x2="318" y2="381" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Enc(a) -->
  <rect x="326" y="305" width="100" height="42" rx="6" fill="#dce6f5" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="376" y="330" text-anchor="middle" font-size="13" fill="#2c4a6e" font-weight="500">Enc(a)</text>

  <!-- Enc(b) -->
  <rect x="326" y="360" width="100" height="42" rx="6" fill="#dce6f5" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="376" y="385" text-anchor="middle" font-size="13" fill="#2c4a6e" font-weight="500">Enc(b)</text>

  <!-- Arrows from Enc(a) and Enc(b) to Add -->
  <line x1="426" y1="326" x2="478" y2="348" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="426" y1="381" x2="478" y2="358" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Add in ciphertext space -->
  <rect x="486" y="330" width="110" height="42" rx="20" fill="#c5d5ea" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="541" y="349" text-anchor="middle" font-size="12" fill="#2c4a6e" font-weight="600">Add in</text>
  <text x="541" y="364" text-anchor="middle" font-size="12" fill="#2c4a6e" font-weight="600">ciphertext</text>

  <!-- Arrow to Enc(a+b) bottom -->
  <line x1="596" y1="351" x2="618" y2="321" stroke="#b8860b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Enc(a+b) — Path 2 result -->
  <rect x="626" y="295" width="130" height="50" rx="6" fill="#fdf3e0" stroke="#b8860b" stroke-width="2"/>
  <text x="691" y="325" text-anchor="middle" font-size="14" fill="#7a5a00" font-weight="600">Enc(a + b)</text>

  <!-- Legend -->
  <rect x="30" y="10" width="12" height="12" rx="2" fill="#e8f0e4" stroke="#4a7c59" stroke-width="1"/>
  <text x="48" y="20" font-size="10" fill="#555">Plaintext ops</text>
  <rect x="120" y="10" width="12" height="12" rx="2" fill="#d4dff0" stroke="#4a6fa5" stroke-width="1"/>
  <text x="138" y="20" font-size="10" fill="#555">Encrypted ops</text>
  <rect x="218" y="10" width="12" height="12" rx="2" fill="#fdf3e0" stroke="#b8860b" stroke-width="1"/>
  <text x="236" y="20" font-size="10" fill="#555">Convergence</text>
</svg>