<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C67A00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="white"/>

  <!-- Title -->
  <text x="510" y="42" text-anchor="middle" fill="#1B2A4A" font-size="16" font-weight="bold">Prisoner's Dilemma</text>

  <!-- Column header label -->
  <text x="560" y="78" text-anchor="middle" fill="#4682B4" font-size="14" font-weight="bold">Player B</text>

  <!-- Column headers -->
  <rect x="370" y="92" width="190" height="52" rx="5" fill="#1B2A4A"/>
  <text x="465" y="124" text-anchor="middle" fill="white" font-size="14">Cooperate</text>

  <rect x="575" y="92" width="190" height="52" rx="5" fill="#1B2A4A"/>
  <text x="670" y="124" text-anchor="middle" fill="white" font-size="14">Defect</text>

  <!-- Row header label -->
  <text x="220" y="78" text-anchor="middle" fill="#4682B4" font-size="14" font-weight="bold">Player A</text>

  <!-- Row headers -->
  <rect x="150" y="156" width="205" height="160" rx="5" fill="#1B2A4A"/>
  <text x="252" y="243" text-anchor="middle" fill="white" font-size="14">Cooperate</text>

  <rect x="150" y="330" width="205" height="160" rx="5" fill="#1B2A4A"/>
  <text x="252" y="417" text-anchor="middle" fill="white" font-size="14">Defect</text>

  <!-- Cell: Cooperate / Cooperate -->
  <rect x="370" y="156" width="190" height="160" rx="5" fill="#EEF2F7" stroke="#B0BEC5" stroke-width="1.5"/>
  <text x="465" y="230" text-anchor="middle" fill="#1B2A4A" font-size="18" font-weight="bold">-1, -1</text>
  <text x="465" y="258" text-anchor="middle" fill="#5A6A7A" font-size="12">Both cooperate</text>

  <!-- Cell: Cooperate / Defect -->
  <rect x="575" y="156" width="190" height="160" rx="5" fill="#EEF2F7" stroke="#B0BEC5" stroke-width="1.5"/>
  <text x="670" y="230" text-anchor="middle" fill="#1B2A4A" font-size="18" font-weight="bold">-3, 0</text>
  <text x="670" y="258" text-anchor="middle" fill="#5A6A7A" font-size="12">A suffers</text>

  <!-- Cell: Defect / Cooperate -->
  <rect x="370" y="330" width="190" height="160" rx="5" fill="#EEF2F7" stroke="#B0BEC5" stroke-width="1.5"/>
  <text x="465" y="404" text-anchor="middle" fill="#1B2A4A" font-size="18" font-weight="bold">0, -3</text>
  <text x="465" y="432" text-anchor="middle" fill="#5A6A7A" font-size="12">B suffers</text>

  <!-- Cell: Defect / Defect — Nash Equilibrium highlight -->
  <rect x="575" y="330" width="190" height="160" rx="5" fill="#FFF8EE" stroke="#C67A00" stroke-width="3"/>
  <text x="670" y="404" text-anchor="middle" fill="#1B2A4A" font-size="18" font-weight="bold">-2, -2</text>
  <text x="670" y="432" text-anchor="middle" fill="#C67A00" font-size="12" font-weight="bold">Both defect</text>

  <!-- Nash Equilibrium annotation arrow and label -->
  <line x1="670" y1="500" x2="670" y2="530" stroke="#C67A00" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="534" width="200" height="34" rx="4" fill="#FFF3E0" stroke="#C67A00" stroke-width="1.5"/>
  <text x="670" y="557" text-anchor="middle" fill="#C67A00" font-size="13" font-weight="bold">Nash Equilibrium</text>

  <!-- Bottom caption -->
  <rect x="160" y="584" width="580" height="28" rx="4" fill="#F7F9FC" stroke="#B0BEC5" stroke-width="1"/>
  <text x="450" y="603" text-anchor="middle" fill="#455A64" font-size="11">Nash Equilibrium (Defect/Defect) is not the optimal outcome (Cooperate/Cooperate)</text>
</svg>