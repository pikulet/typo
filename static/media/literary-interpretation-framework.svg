<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7a8a9e"/>
    </marker>
  </defs>

  <!-- Arrows from each node to center -->
  <!-- World (top) -> Center -->
  <line x1="260" y1="102" x2="260" y2="208" stroke="#7a8a9e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Text (right) -> Center -->
  <line x1="335" y1="260" x2="312" y2="260" stroke="#7a8a9e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Author (bottom) -> Center -->
  <line x1="260" y1="418" x2="260" y2="312" stroke="#7a8a9e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Reader (left) -> Center -->
  <line x1="185" y1="260" x2="208" y2="260" stroke="#7a8a9e" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Center node: Interpretation (highlighted amber) -->
  <rect x="210" y="218" width="100" height="84" rx="12" ry="12" fill="#e8a838" stroke="#c8882a" stroke-width="1.5"/>
  <text x="260" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2a00">Interpretation</text>
  <line x1="224" y1="262" x2="296" y2="262" stroke="#c8882a" stroke-width="0.5" opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="9" fill="#5a4010" opacity="0.85">where all</text>
  <text x="260" y="292" text-anchor="middle" font-size="9" fill="#5a4010" opacity="0.85">factors converge</text>

  <!-- Top node: World -->
  <rect x="195" y="30" width="130" height="72" rx="10" ry="10" fill="#5b7a9e" stroke="#47627e" stroke-width="1.5"/>
  <text x="260" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">World</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#d0dae4">prevailing social</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#d0dae4">concerns</text>

  <!-- Right node: Text -->
  <rect x="335" y="224" width="130" height="72" rx="10" ry="10" fill="#5b7a9e" stroke="#47627e" stroke-width="1.5"/>
  <text x="400" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Text</text>
  <text x="400" y="272" text-anchor="middle" font-size="10" fill="#d0dae4">literary content</text>
  <text x="400" y="284" text-anchor="middle" font-size="10" fill="#d0dae4">itself</text>

  <!-- Bottom node: Author -->
  <rect x="195" y="418" width="130" height="72" rx="10" ry="10" fill="#5b7a9e" stroke="#47627e" stroke-width="1.5"/>
  <text x="260" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Author</text>
  <text x="260" y="466" text-anchor="middle" font-size="10" fill="#d0dae4">writer's intent</text>

  <!-- Left node: Reader -->
  <rect x="55" y="224" width="130" height="72" rx="10" ry="10" fill="#5b7a9e" stroke="#47627e" stroke-width="1.5"/>
  <text x="120" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Reader</text>
  <text x="120" y="272" text-anchor="middle" font-size="10" fill="#d0dae4">audience</text>
  <text x="120" y="284" text-anchor="middle" font-size="10" fill="#d0dae4">interpretation</text>

  <!-- Subtitle -->
  <text x="260" y="510" text-anchor="middle" font-size="10" fill="#888888" font-style="italic">Contextual variation in any factor produces different valid interpretations</text>
</svg>