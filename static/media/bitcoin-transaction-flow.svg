<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="420" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="440" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#44403c" letter-spacing="0.5">Bitcoin Transaction Flow</text>

  <!-- ========== MAIN FLOW (top row) ========== -->

  <!-- 1. Sender -->
  <rect x="32" y="60" width="120" height="72" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="92" y="90" text-anchor="middle" font-size="20" fill="#b45309">&#x1F464;</text>
  <text x="92" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Sender</text>

  <!-- Arrow 1 -->
  <line x1="152" y1="96" x2="208" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="88" text-anchor="middle" font-size="9" fill="#78716c">broadcast</text>

  <!-- 2. Network -->
  <rect x="210" y="60" width="140" height="72" rx="8" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Node icons -->
  <circle cx="245" cy="88" r="6" fill="#475569" fill-opacity="0.25" stroke="#475569" stroke-width="1"/>
  <circle cx="265" cy="82" r="6" fill="#475569" fill-opacity="0.25" stroke="#475569" stroke-width="1"/>
  <circle cx="285" cy="88" r="6" fill="#475569" fill-opacity="0.25" stroke="#475569" stroke-width="1"/>
  <circle cx="255" cy="98" r="6" fill="#475569" fill-opacity="0.25" stroke="#475569" stroke-width="1"/>
  <circle cx="275" cy="98" r="6" fill="#475569" fill-opacity="0.25" stroke="#475569" stroke-width="1"/>
  <!-- Lines between nodes -->
  <line x1="245" y1="88" x2="265" y2="82" stroke="#475569" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="265" y1="82" x2="285" y2="88" stroke="#475569" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="245" y1="88" x2="255" y2="98" stroke="#475569" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="285" y1="88" x2="275" y2="98" stroke="#475569" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="255" y1="98" x2="275" y2="98" stroke="#475569" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="280" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Network</text>

  <!-- Arrow 2 -->
  <line x1="350" y1="96" x2="406" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="378" y="88" text-anchor="middle" font-size="9" fill="#78716c">verify</text>

  <!-- 3. Miners (PoW) -->
  <rect x="408" y="60" width="140" height="72" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Pickaxe symbol -->
  <text x="478" y="92" text-anchor="middle" font-size="22" fill="#b45309">&#x26CF;</text>
  <text x="478" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Miners</text>
  <text x="478" y="66" text-anchor="middle" font-size="9" fill="#78716c">Proof of Work</text>

  <!-- Arrow 3 -->
  <line x1="548" y1="96" x2="604" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="576" y="88" text-anchor="middle" font-size="9" fill="#78716c">confirm</text>

  <!-- 4. Blockchain -->
  <rect x="606" y="60" width="140" height="72" rx="8" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Chain of blocks -->
  <rect x="624" y="82" width="24" height="18" rx="3" fill="#475569" fill-opacity="0.2" stroke="#475569" stroke-width="1"/>
  <rect x="656" y="82" width="24" height="18" rx="3" fill="#475569" fill-opacity="0.2" stroke="#475569" stroke-width="1"/>
  <rect x="688" y="82" width="24" height="18" rx="3" fill="#475569" fill-opacity="0.3" stroke="#475569" stroke-width="1"/>
  <rect x="720" y="82" width="14" height="18" rx="3" fill="#f59e0b" fill-opacity="0.3" stroke="#d97706" stroke-width="1"/>
  <line x1="648" y1="91" x2="656" y2="91" stroke="#475569" stroke-width="1"/>
  <line x1="680" y1="91" x2="688" y2="91" stroke="#475569" stroke-width="1"/>
  <line x1="712" y1="91" x2="720" y2="91" stroke="#475569" stroke-width="1"/>
  <text x="676" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Blockchain</text>

  <!-- Arrow 4 -->
  <line x1="746" y1="96" x2="782" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="764" y="88" text-anchor="middle" font-size="9" fill="#78716c">reward</text>

  <!-- 5. Miner Reward -->
  <rect x="784" y="60" width="72" height="72" rx="8" fill="#f59e0b" fill-opacity="0.18" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="92" text-anchor="middle" font-size="22" fill="#d97706">&#x20BF;</text>
  <text x="820" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Reward</text>

  <!-- ========== DISTRIBUTED LEDGER (bottom section) ========== -->

  <!-- Divider -->
  <line x1="60" y1="168" x2="820" y2="168" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Section label -->
  <text x="440" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#44403c" letter-spacing="0.3">Distributed Ledger -- No Single Point of Failure</text>

  <!-- Ledger copies across nodes -->
  <!-- Node 1 -->
  <g transform="translate(80, 220)">
    <rect width="100" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <rect x="8" y="8" width="84" height="14" rx="2" fill="#475569" fill-opacity="0.12"/>
    <text x="50" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Node A</text>
    <line x1="12" y1="32" x2="88" y2="32" stroke="#e7e5e4" stroke-width="0.8"/>
    <text x="14" y="44" font-size="7.5" fill="#78716c">Tx #1041</text>
    <text x="14" y="56" font-size="7.5" fill="#78716c">Tx #1042</text>
    <text x="14" y="68" font-size="7.5" fill="#78716c">Tx #1043</text>
    <text x="14" y="80" font-size="7.5" fill="#d97706" font-weight="600">Tx #1044</text>
    <rect x="12" y="74" width="76" height="12" rx="2" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="50" y="104" text-anchor="middle" font-size="16" fill="#475569">&#x1F4BB;</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(230, 220)">
    <rect width="100" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <rect x="8" y="8" width="84" height="14" rx="2" fill="#475569" fill-opacity="0.12"/>
    <text x="50" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Node B</text>
    <line x1="12" y1="32" x2="88" y2="32" stroke="#e7e5e4" stroke-width="0.8"/>
    <text x="14" y="44" font-size="7.5" fill="#78716c">Tx #1041</text>
    <text x="14" y="56" font-size="7.5" fill="#78716c">Tx #1042</text>
    <text x="14" y="68" font-size="7.5" fill="#78716c">Tx #1043</text>
    <text x="14" y="80" font-size="7.5" fill="#d97706" font-weight="600">Tx #1044</text>
    <rect x="12" y="74" width="76" height="12" rx="2" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="50" y="104" text-anchor="middle" font-size="16" fill="#475569">&#x1F4BB;</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(380, 220)">
    <rect width="100" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <rect x="8" y="8" width="84" height="14" rx="2" fill="#475569" fill-opacity="0.12"/>
    <text x="50" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Node C</text>
    <line x1="12" y1="32" x2="88" y2="32" stroke="#e7e5e4" stroke-width="0.8"/>
    <text x="14" y="44" font-size="7.5" fill="#78716c">Tx #1041</text>
    <text x="14" y="56" font-size="7.5" fill="#78716c">Tx #1042</text>
    <text x="14" y="68" font-size="7.5" fill="#78716c">Tx #1043</text>
    <text x="14" y="80" font-size="7.5" fill="#d97706" font-weight="600">Tx #1044</text>
    <rect x="12" y="74" width="76" height="12" rx="2" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="50" y="104" text-anchor="middle" font-size="16" fill="#475569">&#x1F4BB;</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(530, 220)">
    <rect width="100" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <rect x="8" y="8" width="84" height="14" rx="2" fill="#475569" fill-opacity="0.12"/>
    <text x="50" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Node D</text>
    <line x1="12" y1="32" x2="88" y2="32" stroke="#e7e5e4" stroke-width="0.8"/>
    <text x="14" y="44" font-size="7.5" fill="#78716c">Tx #1041</text>
    <text x="14" y="56" font-size="7.5" fill="#78716c">Tx #1042</text>
    <text x="14" y="68" font-size="7.5" fill="#78716c">Tx #1043</text>
    <text x="14" y="80" font-size="7.5" fill="#d97706" font-weight="600">Tx #1044</text>
    <rect x="12" y="74" width="76" height="12" rx="2" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="50" y="104" text-anchor="middle" font-size="16" fill="#475569">&#x1F4BB;</text>
  </g>

  <!-- Node 5 -->
  <g transform="translate(680, 220)">
    <rect width="100" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
    <rect x="8" y="8" width="84" height="14" rx="2" fill="#475569" fill-opacity="0.12"/>
    <text x="50" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">Node E</text>
    <line x1="12" y1="32" x2="88" y2="32" stroke="#e7e5e4" stroke-width="0.8"/>
    <text x="14" y="44" font-size="7.5" fill="#78716c">Tx #1041</text>
    <text x="14" y="56" font-size="7.5" fill="#78716c">Tx #1042</text>
    <text x="14" y="68" font-size="7.5" fill="#78716c">Tx #1043</text>
    <text x="14" y="80" font-size="7.5" fill="#d97706" font-weight="600">Tx #1044</text>
    <rect x="12" y="74" width="76" height="12" rx="2" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="50" y="104" text-anchor="middle" font-size="16" fill="#475569">&#x1F4BB;</text>
  </g>

  <!-- Sync arrows between nodes -->
  <line x1="188" y1="390" x2="224" y2="390" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="338" y1="390" x2="374" y2="390" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="488" y1="390" x2="524" y2="390" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="638" y1="390" x2="674" y2="390" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Caption -->
  <text x="440" y="410" text-anchor="middle" font-size="10" fill="#a8a29e" font-style="italic">Each node maintains an identical copy of the ledger</text>
</svg>